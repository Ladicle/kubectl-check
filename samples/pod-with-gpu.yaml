apiVersion: v1
kind: Pod
metadata:
  name: sample-pod-with-gpu
  namespace: default
  labels:
    app: sample-gpu-pod
spec:
  containers:
  - name: gpu-app
    image: nvidia/cuda:11.0-base
    command: ["sh", "-c", "sleep 3600"]
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
        nvidia.com/gpu: "1"
      limits:
        cpu: 200m
        memory: 256Mi
        nvidia.com/gpu: "1"
