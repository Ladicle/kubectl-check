apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-deployment-with-pvc
  namespace: default
  labels:
    app: nginx-with-storage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-with-storage
  template:
    metadata:
      labels:
        app: nginx-with-storage
    spec:
      containers:
      - name: nginx
        image: nginx:1.21
        ports:
        - containerPort: 80
        volumeMounts:
        - name: data
          mountPath: /usr/share/nginx/html
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sample-pvc
