apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sample-daemonset
  namespace: default
spec:
  selector:
    matchLabels:
      app: sample-daemonset
  template:
    metadata:
      labels:
        app: sample-daemonset
    spec:
      containers:
      - name: fluentd
        image: busybox:latest
        command: ["sh", "-c", "sleep 3600"]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
