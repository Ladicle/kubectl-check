apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: sample-replicaset
  namespace: default
  labels:
    app: sample-app
    pod-template-hash: abc123
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sample-app
      pod-template-hash: abc123
  template:
    metadata:
      labels:
        app: sample-app
        pod-template-hash: abc123
    spec:
      containers:
      - name: nginx
        image: nginx:1.21
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
