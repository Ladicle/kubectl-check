version: 2
project_name: kubectl-check
builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -w
      - -X github.com/Ladicle/kubectl-check/cmd.version={{ .Version }}
      - -X github.com/Ladicle/kubectl-check/cmd.commit={{ .ShortCommit }}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
brews:
  - repository:
      owner: Ladicle
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"