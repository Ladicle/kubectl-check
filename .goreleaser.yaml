version: 2
project_name: kubectl-check
builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -w
      - -X github.com/Ladicle/kubectl-check/cmd.version={{ .Version }}
      - -X github.com/Ladicle/kubectl-check/cmd.commit={{ .ShortCommit }}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
dockers:
  - image_templates:
      - ghcr.io/Ladicle/{{ .ProjectName }}:{{ .Version }}
    dockerfile: Dockerfile
    build_flag_templates:
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description={{ .ProjectName }}
      - --label=org.opencontainers.image.url=https://github.com/Ladicle/kubectl-check
      - --label=org.opencontainers.image.source=https://github.com/Ladicle/kubectl-check
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.created={{ time "2006-01-02T15:04:05Z07:00" }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses="Apache License 2.0"
brews:
  - name: {{ .ProjectName }}
    repository:
      owner: Ladicle
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
